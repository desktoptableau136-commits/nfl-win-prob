<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Win Probability</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Live NFL win probability from a homemade XGBoost model, updated every play.">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Win Prob">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #14171c; --muted: #646b76; --line: #e3e6ea;
    --accent: #d4342c; --good: #1f8a4c; --warn: #c26a00; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --ink: #eef0f3; --muted: #9aa1ab; --line: #2a2f37; --accent: #ff5a4f; --good: #4cc27f; --warn: #f0a33a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; }
  #app.gameview, body.gameview header.top .wrap { max-width: 1180px; }
  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 52px; padding-bottom: 0; }

  /* compact score bar that stays on screen once the scoreboard scrolls away */
  /* it floats below the header rather than making the header taller: growing the header would push the
     page down, bring the scoreboard back into view, hide the bar again, and bounce (Safari/iPad has no scroll anchoring) */
  #mini { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--line); }
  #mini.show { display: block; }
  #mini .wrap { display: block; height: auto; padding-top: 6px; padding-bottom: 7px; max-width: 1180px; }
  #mini .line { display: flex; align-items: center; gap: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
  #mini img { width: 20px; height: 20px; object-fit: contain; }
  #mini .sc { font-weight: 750; }
  #mini .clk { color: var(--muted); font-size: 12.5px; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mini .wp { font-weight: 750; white-space: nowrap; }
  #mini .wpbar { height: 4px; margin-top: 5px; }
  .brand { font-weight: 700; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  #status { font-size: 12.5px; color: var(--muted); }
  #status.err { color: var(--accent); }

  /* week nav */
  .weeknav { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 12px; }
  .weeknav h1 { font-size: 18px; margin: 0; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px;
    padding: 8px 14px; font: inherit; cursor: pointer; min-width: 44px; min-height: 40px; }
  .btn:active { transform: scale(0.97); }

  /* game cards */
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: block; }
  .card.live { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .trow { display: flex; align-items: center; gap: 10px; height: 30px; }
  .trow img { width: 24px; height: 24px; object-fit: contain; }
  .trow .abbr { font-weight: 650; width: 44px; }
  .trow .name { flex: 1; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .score { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 17px; }
  .trow .score.lose { color: var(--muted); font-weight: 500; }
  .poss { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-left: 4px; vertical-align: middle; }
  .cardfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #fff; background: var(--accent); border-radius: 5px; padding: 2px 6px; margin-right: 6px; }
  .wpbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); margin-top: 8px; }
  .wpbar div { height: 100%; transition: width .6s ease; }

  /* game view */
  .back { display: inline-flex; align-items: center; gap: 6px; margin: 14px 0 8px; color: var(--muted); min-height: 40px; }
  .board { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 8px; }
  .team img { width: 48px; height: 48px; object-fit: contain; }
  .team .abbr { font-weight: 700; }
  .team .big { font-size: 34px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tos { display: flex; justify-content: center; gap: 4px; margin-top: 4px; height: 6px; }
  .tos i { width: 14px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .85; }
  .tos i.used { opacity: .15; }
  .mid { font-size: 13px; color: var(--muted); max-width: 120px; }
  .mid .clock { font-size: 15px; color: var(--ink); font-weight: 650; }
  .hero { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .hero .pct { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero .row { display: flex; justify-content: space-between; align-items: end; gap: 10px; flex-wrap: wrap; }
  .hero .wpbar { height: 12px; border-radius: 6px; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 12px; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  details.panel > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 32px; margin: -6px 0; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary h2 { margin: 0; flex: 1; }
  details.panel > summary .peek { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  details.panel > summary .peek .chip { padding: 3px 7px; }
  details.panel > summary .caret { color: var(--muted); transition: transform .15s; }
  details.panel[open] > summary { margin-bottom: 8px; }
  details.panel[open] > summary .caret { transform: rotate(90deg); }
  details.panel[open] > summary .peek { display: none; }
  .charthead { display: flex; justify-content: space-between; align-items: center; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; min-height: 32px; }
  svg.chart { width: 100%; display: block; touch-action: pan-y; user-select: none; }
  .readout { min-height: 64px; margin-top: 8px; font-size: 13.5px; }
  .readout .meta { color: var(--muted); font-size: 12.5px; }

  .plays { list-style: none; padding: 0; margin: 0; }
  .plays li { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .plays li:first-child { border-top: 0; }
  .chip { font-size: 12.5px; font-weight: 700; border-radius: 7px; padding: 3px 0; text-align: center; color: #fff; align-self: start; font-variant-numeric: tabular-nums; }
  .chip.flat { background: var(--line); color: var(--muted); font-weight: 500; }
  .plays .meta { font-size: 12px; color: var(--muted); }
  .plays li.tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .plays li.tap:active { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .plays li.key { background: color-mix(in srgb, var(--ink) 4%, transparent); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
  .plays li.picked { box-shadow: inset 3px 0 0 var(--ink); }
  /* the newest play in a live game */
  .plays li.latest { background: color-mix(in srgb, var(--accent) 9%, transparent); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
  .plays li.latest .meta::before { content: "Latest · "; color: var(--accent); font-weight: 650; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase;
    border-radius: 4px; padding: 1px 5px; margin: 0 5px 2px 0; color: #fff; background: var(--muted); vertical-align: 1px; }
  .tag.good { background: var(--good); }
  .tag.bad { background: var(--accent); }
  .panelhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .panelhead h2 { margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; padding: 6px 10px; min-height: 32px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--card); font-weight: 650; }
  .linkbtn { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 4px 0; }

  /* 4th-down helper */
  .fourth .sub { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
  .opt { padding: 8px 0; border-top: 1px solid var(--line); }
  .opt:first-of-type { border-top: 0; }
  .opt .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .opt .name { font-weight: 650; }
  .opt .why { font-size: 12.5px; color: var(--muted); }
  .opt .wp { font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .opt .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 5px; overflow: hidden; }
  .opt .bar div { height: 100%; border-radius: 3px; background: var(--muted); }
  .opt.best .bar div { background: var(--good); }
  .verdict { font-size: 13px; margin-top: 8px; }
  .call { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .call b { color: var(--ink); font-weight: 650; }

  /* next-snap stakes */
  .meter { position: relative; height: 8px; border-radius: 4px; background: var(--line); margin: 4px 0 18px; }
  .meter .fill { height: 100%; border-radius: 4px; }
  .meter .typ { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .5; }
  .meter .typlab { position: absolute; top: 11px; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
  .stakes .sub { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .scen .row { display: grid; grid-template-columns: 1fr auto 44px; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
  .scen .row:first-child { border-top: 0; }
  .scen .w { font-weight: 650; }
  .scen .d { text-align: right; color: var(--muted); }
  .scen .d.up { color: var(--good); font-weight: 650; }
  .scen .d.down { color: var(--accent); font-weight: 650; }

  /* "watch now" on the games list */
  .watch { display: block; background: var(--card); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; }
  .watch .wline { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 750; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .watch img { width: 24px; height: 24px; object-fit: contain; }
  .watch .go { margin-left: auto; color: var(--muted); font-weight: 400; }

  /* mini charts on the games list */
  .spark { height: 52px; margin-top: 8px; }
  .spark svg { display: block; width: 100%; height: 52px; }

  /* game summary */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat .d { font-size: 12.5px; color: var(--muted); }

  /* "About the model" on the games list */
  .about { font-size: 14px; line-height: 1.5; }
  .about h3 { font-size: 15px; margin: 16px 0 6px; }
  .about h3:first-child { margin-top: 0; }
  .about p { margin: 0 0 8px; }
  .about ul { margin: 0 0 8px; padding-left: 20px; }
  .about table { border-collapse: collapse; width: 100%; max-width: 420px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .about th, .about td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  .about th:first-child, .about td:first-child { text-align: left; padding-left: 0; }
  .about th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .about td.win { font-weight: 750; }
  .about .small { font-size: 12.5px; color: var(--muted); }
  .about a { text-decoration: underline; }
  svg.calib { width: 100%; max-width: 360px; display: block; margin: 4px 0; }

  /* wide screens: chart on the left (stays put), plays on the right */
  #chartpanel { scroll-margin-top: 110px; }
  @media (min-width: 820px) {
    .cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 14px; align-items: start; }
    .cols .colA { position: sticky; top: var(--stick, 64px); max-height: calc(100vh - var(--stick, 64px)); max-height: calc(100svh - var(--stick, 64px)); overflow-y: auto;
      padding-bottom: 12px; scrollbar-width: thin; }
  }
  .plays .txt { font-size: 13.5px; }
  .more { margin-top: 8px; width: 100%; }
  .note { font-size: 12px; color: var(--muted); margin-top: 16px; }
  .empty { text-align: center; padding: 40px 0; color: var(--muted); }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/">🏈 Live Win Probability</a>
  <span id="status"></span>
</div><div id="mini"></div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>

<script type="module">
import { loadGames, loadGame } from "./js/espn.js";
import { addFourthDowns } from "./js/fourth.js";
import { addLeverage } from "./js/leverage.js";

const $app = document.getElementById("app");
const $status = document.getElementById("status");
let timer = null, lastOk = 0, failing = false, view = null;

// ---------- helpers ----------
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
}
const pct = p => `${Math.round(p * 100)}%`;
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;

function lum(hex) {
  const c = hex.replace("#", "").match(/../g).map(x => parseInt(x, 16) / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contrast(a, b) { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); }
function rgbDist(a, b) {
  const p = h => h.replace("#", "").match(/../g).map(x => parseInt(x, 16));
  const [x, y] = [p(a), p(b)]; return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);
}
// pick a team color that is visible on the current background, and distinct from the opponent
function teamColors(home, away) {
  const bg = dark() ? "#181b21" : "#ffffff";
  // main color if it's readable on this background, else the alternate, else neutral
  const pick = t => [t.color, t.alt_color].find(c => contrast(c, bg) >= 2.2) || (dark() ? "#cfd3da" : "#3a3f47");
  const h = pick(home);
  let a = pick(away);
  if (rgbDist(h, a) < 90) {
    const alt = [away.alt_color, away.color].find(c => c !== a && contrast(c, bg) >= 2.2 && rgbDist(h, c) >= 90);
    a = alt || (dark() ? "#cfd3da" : "#5b616b");
  }
  return { home: h, away: a };
}
const onColor = c => contrast(c, "#ffffff") >= contrast(c, "#14171c") ? "#ffffff" : "#14171c";
function lineText(g) {
  if (g.spread_home === null || g.spread_home === undefined) return "No line";
  if (g.spread_home === 0) return "Pick'em";
  const fav = g.spread_home > 0 ? g.home : g.away;
  return `${fav.abbr} −${Math.abs(g.spread_home)}`;
}
function setStatus() {
  if (failing) { $status.textContent = "Can't reach ESPN, retrying…"; $status.className = "err"; return; }
  if (!lastOk) { $status.textContent = ""; return; }
  const s = Math.round((Date.now() - lastOk) / 1000);
  $status.textContent = `Updated ${s < 5 ? "just now" : s + "s ago"}`; $status.className = "";
}
setInterval(setStatus, 1000);

async function attempt(load) {
  try {
    const data = await load();
    lastOk = Date.now(); failing = false; setStatus();
    return data;
  } catch (e) { console.error(e); failing = true; setStatus(); return null; }
}
function schedule(fn, ms) { clearTimeout(timer); timer = setTimeout(fn, ms); }

// ---------- games list ----------
function parseQuery() {
  const q = new URLSearchParams(location.hash.split("?")[1] || "");
  return { week: q.get("week"), seasontype: q.get("seasontype"), year: q.get("year") };
}

async function showList() {
  view = "list";
  const q = parseQuery();
  const data = await attempt(() => loadGames(q).then(async d => {
    await Promise.all(d.games.map(g => addLeverage(g).catch(e => console.error(e))));
    return d;
  }));
  if (view !== "list") return;
  if (!data) { if (!$app.querySelector(".grid")) $app.replaceChildren(el("p", { class: "empty" }, "Couldn't load games.")); schedule(showList, 10000); return; }

  const label = data.seasontype === 3 ? `Playoffs · Round ${data.week}` : data.seasontype === 1 ? `Preseason · Week ${data.week}` : `Week ${data.week}`;
  const go = w => `#/?week=${w}&seasontype=${data.seasontype}&year=${data.year}`;
  const nav = el("div", { class: "weeknav" },
    el("a", { class: "btn", href: go(Math.max(1, data.week - 1)), "aria-label": "Previous week" }, "‹"),
    el("h1", {}, `${data.year} ${label}`),
    el("a", { class: "btn", href: go(data.week + 1), "aria-label": "Next week" }, "›"));

  const grid = el("div", { class: "grid" }, data.games.map(gameCard));
  $app.replaceChildren(nav, ...[watchNow(data.games)].filter(Boolean), data.games.length ? grid : el("p", { class: "empty" }, "No games this week."),
    el("p", { class: "note" }, "Pregame percentages come from the betting line alone. Tap a game for the full chart."),
    aboutPanel());
  schedule(showList, data.games.some(g => g.state === "in") ? 20000 : 120000);
  fillSparks(data.games.filter(g => g.state === "post" && !sparkCache.has(g.id)));
}

// With two or more games on, point to the one whose next snap matters most.
function watchNow(games) {
  const live = games.filter(g => g.state === "in" && g.now?.stakes);
  if (live.length < 2) return null;
  const g = live.reduce((a, b) => b.now.stakes.index > a.now.stakes.index ? b : a);
  const st = g.now.stakes;
  const ball = g.now.posteam === g.home.id ? g.home : g.away;
  return el("a", { class: "watch", href: `#/game/${g.id}` },
    el("div", { class: "small muted" }, `Watch now · the biggest next snap of the ${live.length} live games`),
    el("div", { class: "wline" }, el("img", { src: g.away.logo, alt: "" }), `${g.away.abbr} ${g.away.score}–${g.home.score} ${g.home.abbr}`,
      el("img", { src: g.home.logo, alt: "" }), el("span", { class: "go" }, "›")),
    el("div", { class: "small" }, [g.detail, `${ball.abbr} ball`, g.now.down_text].filter(Boolean).join(" · "), " · ",
      el("b", { style: `color:${stakesColor(st)}` }, `${st.label} stakes (${st.index.toFixed(1)}×)`)));
}
const stakesColor = st => st.index >= 2.5 ? "var(--accent)" : st.index >= 1.5 ? "var(--warn)" : "var(--muted)";

// 2025 test: a copy of the model trained on 2006-24 only vs ESPN's number at the same snap (Brier score)
const VS_ESPN = [["Whole game", 0.159, 0.165], ["1st quarter", 0.206, 0.216], ["2nd quarter", 0.181, 0.188],
  ["3rd quarter", 0.149, 0.153], ["4th quarter", 0.109, 0.110], ["Last 5 minutes", 0.089, 0.089], ["Overtime", 0.174, 0.177]];

// Same 2025 test, as a calibration chart: snaps grouped by the win chance shown, [average shown, how often that team won].
// Each snap counts from both teams' side. Printed by live.compare_espn.
const CALIBRATION = {
  ours: [[0.032, 0.05], [0.151, 0.189], [0.25, 0.289], [0.35, 0.36], [0.449, 0.449], [0.551, 0.551], [0.65, 0.64], [0.75, 0.711], [0.849, 0.811], [0.968, 0.95]],
  espn: [[0.032, 0.049], [0.15, 0.141], [0.252, 0.257], [0.351, 0.345], [0.451, 0.455], [0.549, 0.546], [0.649, 0.654], [0.748, 0.742], [0.85, 0.859], [0.968, 0.951]],
};

function calibrationChart() {
  const W = 300, H = 260, pad = { l: 36, r: 18, t: 10, b: 32 };
  const X = v => pad.l + v * (W - pad.l - pad.r), Y = v => pad.t + (1 - v) * (H - pad.t - pad.b);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, class: "calib", role: "img",
    "aria-label": "Calibration: predicted win chance against how often that team won, ours and ESPN's" });
  const txt = (x, y, t, attrs = {}) => { const n = s("text", { x, y, "font-size": 11, fill: "var(--muted)", ...attrs }); n.textContent = t; svg.append(n); };
  for (const v of [0, 0.25, 0.5, 0.75, 1]) {
    svg.append(s("line", { x1: X(0), x2: X(1), y1: Y(v), y2: Y(v), stroke: "var(--line)" }));
    txt(pad.l - 5, Y(v) + 4, `${v * 100}%`, { "text-anchor": "end" });
    txt(X(v), H - pad.b + 14, `${v * 100}%`, { "text-anchor": "middle" });
  }
  txt(X(0.5), H - 3, "Win chance shown", { "text-anchor": "middle" });
  svg.append(s("line", { x1: X(0), y1: Y(0), x2: X(1), y2: Y(1), stroke: "var(--muted)", "stroke-dasharray": "2 3" }));
  const series = (pts, attrs, r) => {
    svg.append(s("path", { d: pts.map(([p, a], i) => `${i ? "L" : "M"}${X(p).toFixed(1)},${Y(a).toFixed(1)}`).join(""), fill: "none", ...attrs }));
    for (const [p, a] of pts) svg.append(s("circle", { cx: X(p), cy: Y(a), r, fill: attrs.stroke }));
  };
  series(CALIBRATION.espn, { stroke: "var(--muted)", "stroke-width": 1.5, "stroke-dasharray": "4 3" }, 2.5);
  series(CALIBRATION.ours, { stroke: "var(--ink)", "stroke-width": 2 }, 3);
  txt(X(0.03), Y(0.93), "Actually won", { "font-size": 11 });
  return svg;
}

// Finished games never change, so each one's chart is loaded once and kept.
const sparkCache = new Map();
async function fillSparks(games) {
  for (const g of games) {
    if (view !== "list") return;
    try {
      const full = await loadGame(g.id);
      sparkCache.set(g.id, full.points.map(p => [p.minute, p.wp_home]));
    } catch (e) { continue; }
    const box = $app.querySelector(`.spark[data-id="${g.id}"]`);
    if (box) box.replaceChildren(spark(sparkCache.get(g.id), teamColors(g.home, g.away)));
  }
}

function spark(pts, col) {
  const W = 300, H = 52, xmax = Math.max(60, ...pts.map(p => p[0]));
  const X = m => (m / xmax) * W, Y = p => 2 + (1 - p) * (H - 4);
  const id = "k" + Math.random().toString(36).slice(2, 8);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", role: "img", "aria-label": "Win probability over the game" });
  const defs = s("defs");
  const ca = s("clipPath", { id: id + "a" }); ca.append(s("rect", { x: 0, y: 0, width: W, height: Y(0.5) }));
  const cb = s("clipPath", { id: id + "b" }); cb.append(s("rect", { x: 0, y: Y(0.5), width: W, height: H }));
  defs.append(ca, cb); svg.append(defs);
  const line = pts.map(([m, p], i) => `${i ? "L" : "M"}${X(m).toFixed(1)},${Y(p).toFixed(1)}`).join("");
  const area = `${line}L${X(pts[pts.length - 1][0]).toFixed(1)},${Y(0.5)}L${X(pts[0][0]).toFixed(1)},${Y(0.5)}Z`;
  svg.append(s("path", { d: area, fill: col.home, opacity: .3, "clip-path": `url(#${id}a)` }));
  svg.append(s("path", { d: area, fill: col.away, opacity: .3, "clip-path": `url(#${id}b)` }));
  svg.append(s("line", { x1: 0, x2: W, y1: Y(0.5), y2: Y(0.5), stroke: "var(--line)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" }));
  svg.append(s("path", { d: line, fill: "none", stroke: "var(--ink)", "stroke-width": 1.4, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }));
  return svg;
}

// A panel that folds down to one row; `peek` is what shows while it's closed.
function fold(key, title, peek, ...body) {
  return el("details", { class: "panel", ...(folds[key] ? { open: "" } : {}), ontoggle: e => { folds[key] = e.target.open; } },
    el("summary", {}, el("h2", {}, title), el("span", { class: "peek" }, peek), el("span", { class: "caret" }, "›")),
    ...body);
}

const when = p => p.period ? `${p.period > 4 ? "OT" : "Q" + p.period} ${p.clock}` : "";

// Labels for the plays worth noticing. `next` is the following snap, which tells us how a 4th down ended.
function playTags(p, next) {
  if (!p.play_id) return [];
  const k = (p.kind || "").toLowerCase(), t = (p.text || "").toLowerCase(), tags = [];
  const fg = k.includes("field goal");
  if (p.scoring) tags.push(fg ? ["FG", ""] : k.includes("safety") || t.includes("safety") ? ["Safety", ""] : ["TD", ""]);
  else if (fg) tags.push([k.includes("block") ? "FG blocked" : "FG missed", "bad"]);
  if (p.turnover) tags.push([k.includes("intercept") || t.includes("intercept") ? "INT"
    : k.includes("fumble") || t.includes("fumble") ? "Fumble" : "Turnover", "bad"]);
  if (p.down === 4 && !fg && !k.includes("punt") && !k.includes("penalty") && !p.turnover && !p.scoring && next) {
    if (next.posteam === p.posteam && next.down === 1) tags.push(["4th down: converted", "good"]);
    else if (next.posteam && next.posteam !== p.posteam) tags.push(["4th down: stopped", "bad"]);
  }
  return tags;
}

function playList(points, g, col, tags, latestId = null) {
  return el("ul", { class: "plays" }, points.map(p => {
    const s = p.swing ?? 0;
    const gainer = s >= 0 ? g.home : g.away;
    const chip = Math.abs(s) < 0.005 ? el("span", { class: "chip flat" }, "±0")
      : el("span", { class: "chip", style: `background:${s >= 0 ? col.home : col.away};color:${onColor(s >= 0 ? col.home : col.away)}` }, `${gainer.abbr} +${Math.round(Math.abs(s) * 100)}`);
    const t = tags.get(p) || [];
    const cls = ["tap", p.play_id === latestId ? "latest" : t.length ? "key" : "", p.play_id === pickedId ? "picked" : ""].filter(Boolean).join(" ");
    return el("li", { class: cls, "data-play": p.play_id, role: "button", tabindex: "0", onclick: () => pick(p) }, chip, el("div", {},
      el("div", { class: "meta" }, [when(p), p.down_text, `${g.away.abbr} ${p.away_score}–${p.home_score} ${g.home.abbr}`].filter(Boolean).join(" · ")),
      el("div", { class: "txt" }, t.map(([label, c]) => el("span", { class: "tag " + c }, label)), p.text || ""), callLine(p)));
  }));
}

// Tapping a play pins it on the chart (until "Back to now" or touching the chart).
function pick(p) {

  document.querySelectorAll(".plays li").forEach(li => li.classList.toggle("picked", li.dataset.play === pickedId));
  if (chartShow) chartShow(p, true);

  if (r.top < top || r.top > innerHeight * 0.5) panel.scrollIntoView({ behavior: "smooth", block: "start" });
}
function unpick() {
  pickedId = null;
  document.querySelectorAll(".plays li.picked").forEach(li => li.classList.remove("picked"));
}

function summaryPanel(g, col) {
  const pts = g.points.filter(p => p.kind !== "final");
  const done = g.state === "post";
  const stats = [];
  // whose low point to show: the winner, or whoever the model favors right now
  const side = done ? (g.home.score > g.away.score ? "home" : g.home.score < g.away.score ? "away" : null)
    : g.wp_home >= 0.5 ? "home" : "away";
  if (side && pts.length) {
    const team = g[side], wpOf = p => side === "home" ? p.wp_home : 1 - p.wp_home;
    const low = pts.reduce((a, b) => wpOf(b) < wpOf(a) ? b : a);
    stats.push(["Lowest point", el("span", { style: `color:${col[side]}` }, `${team.abbr} ${pct(wpOf(low))}`),
      [done && wpOf(low) < 0.25 ? "Comeback win" : "", when(low) || "Start of game"].filter(Boolean).join(" · ")]);
    const first = wpOf(pts[0]);
    stats.push([done ? "Winner at kickoff" : "At kickoff", el("span", { style: `color:${col[side]}` }, `${team.abbr} ${pct(first)}`),
      done && first < 0.4 ? "Upset" : ""]);
  }
  let leader = 0, changes = 0;
  for (const p of g.points) {
    const d = Math.sign(p.home_score - p.away_score);
    if (d && leader && d !== leader) changes++;
    if (d) leader = d;
  }
  stats.push(["Lead changes", changes, done ? "" : "so far"]);
  const moved = g.points.reduce((t, p) => t + Math.abs(p.swing ?? 0), 0);
  let beat = "";
  if (excitement) {
    const share = Math.max(0, Math.min(99, excitement.percentiles.filter(v => v < moved).length - 1));
    beat = `${done ? "More" : "Already more"} than ${share}% of ${excitement.seasons[0]}–${String(excitement.seasons[1]).slice(2)} games`;
  }
  stats.push(["Excitement", moved.toFixed(1), beat]);
  const calls = g.points.filter(p => p.fourth?.did && !closeCall(p.fourth));  // toss-ups don't count either way
  if (calls.length) {
    const tally = t => { const c = calls.filter(p => p.posteam === t.id); return c.length ? `${t.abbr} ${c.filter(p => p.fourth.did === p.fourth.best).length}/${c.length}` : null; };
    stats.push(["4th-down calls", [tally(g.away), tally(g.home)].filter(Boolean).join(" · "), "matched the model's clear picks"]);
  }
  return fold("summary", done ? "Game summary" : "So far", `Excitement ${moved.toFixed(1)}`,
    el("div", { class: "stats" }, stats.map(([k, v, d]) => el("div", { class: "stat" },
      el("div", { class: "k" }, k), el("div", { class: "v" }, v), d ? el("div", { class: "d" }, d) : null))),
    el("p", { class: "muted small", style: "margin:10px 0 0" },
      "Excitement = how far the win probability line travels, added up play by play (a full swing from 0% to 100% counts 1)."));
}

// ---------- 4th downs ----------
const SHORT = { go: "Go for it", fg: "Field goal", punt: "Punt" };
const DID = { go: "went for it", fg: "kicked the field goal", punt: "punted" };
const pts1 = x => `${(x * 100).toFixed(1)} pts`;
const closeCall = f => f.margin !== null && f.margin < 0.01;

function fourthPanel(g, col, p) {
  const team = p.posteam === g.home.id ? g.home : g.away;
  const f = p.fourth;
  const verdict = f.margin === null ? `${SHORT[f.best]} is the only real option here.`
    : closeCall(f) ? "Close call: the options are within 1 point of win probability."
    : `${SHORT[f.best]} is better by ${pts1(f.margin)} of win probability.`;
  return el("section", { class: "panel fourth" },
    el("h2", {}, `4th down: what should ${team.abbr} do?`),
    el("div", { class: "sub" }, p.down_text),
    f.options.map(o => el("div", { class: "opt" + (o.key === f.best ? " best" : "") },
      el("div", { class: "top" },
        el("div", {}, el("div", { class: "name" }, o.label, o.key === f.best ? el("span", { class: "tag good", style: "margin-left:6px" }, "Best") : null),
          el("div", { class: "why" }, o.chance === null ? o.chanceText : `${pct(o.chance)} ${o.chanceText}`)),
        el("div", { class: "wp" }, pct(o.wp))),
      el("div", { class: "bar" }, el("div", { style: `width:${o.wp * 100}%` })))),
    el("div", { class: "verdict" }, verdict),
    p.stakes ? el("div", { class: "verdict" }, "Stakes on this snap: ",
      el("b", { style: `color:${stakesColor(p.stakes)}` }, `${p.stakes.label} (${p.stakes.index.toFixed(1)}× a typical play)`)) : null,
    el("p", { class: "muted small", style: "margin:6px 0 0" },
      `Percentages are ${team.abbr}'s chance to win after each choice. Odds are for an average offense, kicker and punter (2018–25).`));
}

// one line for a 4th-down play: the model's pick, and whether the team agreed
function callLine(p) {
  const f = p.fourth;
  if (!f) return null;
  const close = closeCall(f);
  const mark = !f.did ? "" : f.did === f.best ? " ✓" : close ? " (fine either way)" : " ✗";
  return el("div", { class: "call" }, "Model's pick: ", el("b", {}, SHORT[f.best]),
    f.margin === null ? "" : close ? " (close call)" : ` (by ${pts1(f.margin)})`,
    f.did ? ` · they ${DID[f.did]}${mark}` : "");
}

// "What's at stake on the next snap" for a live 1st-3rd down
function stakesPanel(g, col, p) {
  const st = p.stakes, team = p.posteam === g.home.id ? g.home : g.away;
  return el("section", { class: "panel stakes" },
    el("div", { class: "panelhead" }, el("h2", {}, "Next snap"),
      el("span", { class: "small", style: `color:${stakesColor(st)};font-weight:700` }, `${st.label} stakes · ${st.index.toFixed(1)}×`)),
    el("div", { class: "meter", title: "Stakes: how much win probability is expected to move on this snap" },
      el("div", { class: "fill", style: `width:${Math.min(1, st.index / 4) * 100}%;background:${stakesColor(st)}` }),
      el("div", { class: "typ", style: "left:25%" }), el("span", { class: "typlab", style: "left:25%" }, "typical")),
    el("div", { class: "sub" }, `${team.abbr} ${pct(st.wp)} now · ${p.down_text}. If this snap ends in…`),
    el("div", { class: "scen" }, st.scenarios.map(x => {
      const d = Math.round((x.wp - st.wp) * 100);
      return el("div", { class: "row" }, el("span", {}, x.label),
        el("span", { class: "w" }, `${team.abbr} ${pct(x.wp)}`),
        el("span", { class: "d " + (d > 0 ? "up" : d < 0 ? "down" : "") }, d > 0 ? `+${d}` : d < 0 ? `−${-d}` : "±0"));
    })),
    el("p", { class: "muted small", style: "margin:8px 0 0" },
      `Stakes = how far ${team.abbr}'s win chance is expected to move on this snap, compared with a typical 1st–3rd down (1×). `,
      "It plays the snap out the usual ways for this down and distance (gains, losses, turnovers) and averages the moves."));
}

// The compact score bar in the header, shown once the big scoreboard scrolls off screen.
function renderMini(g, col, board) {
  const $mini = document.getElementById("mini");
  const wp = g.wp_home, lead = wp >= 0.5 ? g.home : g.away;
  const right = g.state === "post" ? "Final" : g.state === "pre" ? "" : `${lead.abbr} ${pct(Math.max(wp, 1 - wp))}`;
  $mini.replaceChildren(el("div", { class: "wrap" },
    el("div", { class: "line" },
      el("img", { src: g.away.logo, alt: "" }), el("span", { class: "sc" }, `${g.away.abbr} ${g.state === "pre" ? "" : g.away.score}`),
      el("span", { class: "clk" }, [g.detail, g.state === "in" && g.now?.down_text].filter(Boolean).join(" · ")),
      el("span", { class: "sc" }, `${g.state === "pre" ? "" : g.home.score} ${g.home.abbr}`), el("img", { src: g.home.logo, alt: "" }),
      right ? el("span", { class: "wp", style: `color:${wp >= 0.5 ? col.home : col.away}` }, right) : null),
    g.state === "post" ? null : el("div", { class: "wpbar" },
      el("div", { style: `width:${(1 - wp) * 100}%;background:${col.away}` }),
      el("div", { style: `width:${wp * 100}%;background:${col.home}` }))));
  boardObserver?.disconnect();
  const header = document.querySelector("header.top");
  boardObserver = new IntersectionObserver(([e]) => {
    $mini.classList.toggle("show", !e.isIntersecting && !!view?.startsWith("game:"));
    document.documentElement.style.setProperty("--stick", header.offsetHeight + $mini.offsetHeight + 12 + "px");
  }, { rootMargin: "-52px 0px 0px 0px" });
  boardObserver.observe(board);
}
function hideMini() {
  boardObserver?.disconnect(); boardObserver = null;
  document.getElementById("mini").classList.remove("show");
}

// ---------- chart ----------
const NS = "http://www.w3.org/2000/svg";
function s(tag, attrs = {}) { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; }

function drawChart(box, readout, g, col) {
  const W = Math.max(280, box.clientWidth || 600), H = Math.round(Math.min(300, Math.max(190, W * 0.45)));
  const pad = { l: 34, r: 8, t: 10, b: 22 };
  const pts = g.points;
  const xmax = Math.max(60, ...pts.map(p => p.minute));
  const X = m => pad.l + (m / xmax) * (W - pad.l - pad.r);
  const Y = p => pad.t + (1 - p) * (H - pad.t - pad.b);
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Win probability chart" });
  const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
  const ink = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
  const gridc = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
  const id = "c" + Math.random().toString(36).slice(2, 8);

  const defs = s("defs");
  const ca = s("clipPath", { id: id + "a" }); ca.append(s("rect", { x: 0, y: 0, width: W, height: Y(0.5) }));
  const cb = s("clipPath", { id: id + "b" }); cb.append(s("rect", { x: 0, y: Y(0.5), width: W, height: H }));
  defs.append(ca, cb); svg.append(defs);

  for (const q of [15, 30, 45, 60].filter(q => q < xmax)) svg.append(s("line", { x1: X(q), x2: X(q), y1: pad.t, y2: H - pad.b, stroke: gridc, "stroke-dasharray": "3 3" }));
  [[0.5, "50%"]].forEach(([v]) => svg.append(s("line", { x1: pad.l, x2: W - pad.r, y1: Y(v), y2: Y(v), stroke: muted, "stroke-width": 1, opacity: .6 })));
  const labels = [["Q1", 7.5], ["Q2", 22.5], ["Q3", 37.5], ["Q4", 52.5]];
  if (xmax > 60) labels.push(["OT", (60 + xmax) / 2]);
  for (const [t, m] of labels) { const tx = s("text", { x: X(m), y: H - 6, "text-anchor": "middle", "font-size": 11, fill: muted }); tx.textContent = t; svg.append(tx); }
  const lab = (txt, y, c) => { const t = s("text", { x: 4, y, "font-size": 11, "font-weight": 700, fill: c }); t.textContent = txt; svg.append(t); };
  lab(g.home.abbr, pad.t + 10, col.home); lab(g.away.abbr, H - pad.b - 3, col.away);

  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.minute).toFixed(1)},${Y(p.wp_home).toFixed(1)}`).join("");
  const area = `${line}L${X(pts[pts.length - 1].minute).toFixed(1)},${Y(0.5)}L${X(pts[0].minute).toFixed(1)},${Y(0.5)}Z`;
  svg.append(s("path", { d: area, fill: col.home, opacity: .22, "clip-path": `url(#${id}a)` }));
  svg.append(s("path", { d: area, fill: col.away, opacity: .22, "clip-path": `url(#${id}b)` }));
  if (showEspn) {
    const e = pts.filter(p => p.espn_wp_home !== undefined);
    if (e.length > 1) svg.append(s("path", { d: e.map((p, i) => `${i ? "L" : "M"}${X(p.minute).toFixed(1)},${Y(p.espn_wp_home).toFixed(1)}`).join(""),
      fill: "none", stroke: muted, "stroke-width": 1.2, "stroke-dasharray": "4 3" }));
  }
  svg.append(s("path", { d: line, fill: "none", stroke: ink, "stroke-width": 2, "stroke-linejoin": "round" }));
  for (const p of pts) if (p.scoring || p.turnover)
    svg.append(s("circle", { cx: X(p.minute), cy: Y(p.wp_home), r: 3, fill: p.turnover ? "var(--accent)" : ink }));

  const cur = s("line", { y1: pad.t, y2: H - pad.b, stroke: ink, "stroke-width": 1, opacity: 0 });
  const dot = s("circle", { r: 4.5, fill: ink, stroke: "var(--card)", "stroke-width": 2, opacity: 0 });
  svg.append(cur, dot);

  const latest = pts[pts.length - 1];
  const show = (p, live) => {
    cur.setAttribute("x1", X(p.minute)); cur.setAttribute("x2", X(p.minute)); cur.setAttribute("opacity", live ? .35 : 0);
    dot.setAttribute("cx", X(p.minute)); dot.setAttribute("cy", Y(p.wp_home)); dot.setAttribute("opacity", 1);
    const lead = p.wp_home >= 0.5 ? g.home : g.away;
    const espn = p.espn_wp_home !== undefined ? ` · ESPN ${pct(p.wp_home >= 0.5 ? p.espn_wp_home : 1 - p.espn_wp_home)}` : "";
    readout.replaceChildren(...[
      el("div", { class: "meta" }, [when(p), p.down_text, `${g.away.abbr} ${p.away_score}–${p.home_score} ${g.home.abbr}`].filter(Boolean).join(" · ")),
      el("div", {}, el("strong", { style: `color:${p.wp_home >= 0.5 ? col.home : col.away}` }, `${lead.abbr} ${pct(Math.max(p.wp_home, 1 - p.wp_home))}`), el("span", { class: "muted" }, espn)),
      el("div", {}, p.text === "Now" ? "Current situation" : p.text || ""),
      callLine(p),
      pickedId && p.play_id === pickedId ? el("button", { class: "linkbtn", onclick: () => { unpick(); show(latest, false); } }, "Back to now") : null,
    ].filter(Boolean));
  };
  const nearest = evt => {
    const r = svg.getBoundingClientRect();
    const m = ((evt.clientX - r.left) * (W / r.width) - pad.l) / (W - pad.l - pad.r) * xmax;
    return pts.reduce((best, p) => Math.abs(p.minute - m) < Math.abs(best.minute - m) ? p : best, pts[0]);
  };
  svg.addEventListener("pointermove", e => { unpick(); cursor = nearest(e); show(cursor, true); });
  svg.addEventListener("pointerdown", e => { unpick(); cursor = nearest(e); show(cursor, true); });
  svg.addEventListener("pointerleave", () => { cursor = null; show(latest, false); });
  const pinned = pickedId && pts.find(p => p.play_id === pickedId);
  if (pinned) show(pinned, true); else show(latest, false);
  chartShow = show;
  box.replaceChildren(svg);
}

// ---------- routing ----------
function route() {
  clearTimeout(timer); showAll = false; lastGame = null; folds.swings = folds.summary = folds.about = false; pickedId = null; chartShow = null; window.scrollTo(0, 0);
  hideMini(); $app.className = "wrap"; document.body.classList.remove("gameview");
  const m = location.hash.match(/^#\/game\/(\d+)/);
  if (m) { $app.replaceChildren(el("p", { class: "empty" }, "Loading game…")); showGame(m[1]); }
  else showList();
}
addEventListener("hashchange", route);
let lastWidth = innerWidth, resizeTimer = null;
addEventListener("resize", () => {  // phones fire resize when the address bar hides; only redraw on width changes
  if (innerWidth === lastWidth) return;
  lastWidth = innerWidth; clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (lastGame) renderGame(lastGame); }, 150);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (view === "list") showList(); else if (lastGame) showGame(lastGame.id); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (lastGame) renderGame(lastGame); else if (view === "list") showList(); });
route();
</script>
</body>
</html>
