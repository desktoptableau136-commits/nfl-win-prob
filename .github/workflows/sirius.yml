# Refreshes docs/sirius.json (this week's SiriusXM channel for each NFL game) and commits it if it changed.
name: SiriusXM channels

on:
  schedule:
    - cron: "0 13 * * *"     # daily, ~9am Eastern
    - cron: "0 15 * * 0,1,4" # again late morning on game days (Sun, Mon, Thu)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python live/sirius.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Commit if changed
        run: |
          git diff --quiet docs/sirius.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SiriusXM channels" docs/sirius.json
          git push
